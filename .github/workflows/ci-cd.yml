# Intégration et déploiement continus de la plateforme GAVI SIRI R2.
#
#   Pull request vers main : tests uniquement.
#   Push sur main          : tests -> construction -> publication en GitHub Release ;
#                            le serveur l'installe lui-même (cron deploy/pull-deploy.sh, contrôle /up).
#   Lancement manuel       : onglet Actions > CI/CD > Run workflow (option « déployer »).
#
# Aucun secret : le serveur télécharge la release (dépôt public). Voir docs/deploiement.md.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Déployer en production après les tests"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: "8.2"
  NODE_VERSION: "20"
  PHP_EXTENSIONS: mbstring, intl, pdo_sqlite, pdo_mysql, gd, zip, bcmath, exif, fileinfo

jobs:
  # ---------------------------------------------------------------------------
  # 1. Tests (SQLite en mémoire, comme en local) : bloquants pour le déploiement.
  # ---------------------------------------------------------------------------
  tests:
    name: Tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Dépendances Composer
        run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Les vues appellent @vite : le manifeste doit exister pour les tests de pages.
      - name: Assets (Vite)
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Tests
        run: php artisan test

  # ---------------------------------------------------------------------------
  # 2. Contrôle sur MySQL 8 (base de production) : informatif, non bloquant.
  # ---------------------------------------------------------------------------
  tests-mysql:
    name: Tests MySQL 8 (informatif)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gavi_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund && npm run build
      - run: cp .env.example .env && php artisan key:generate --ansi
      - name: Tests sur MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: gavi_test
          DB_USERNAME: root
          DB_PASSWORD: root
        # phpunit.xml force SQLite : on le surcharge ici.
        run: |
          sed -e 's#<env name="DB_CONNECTION" value="sqlite"/>#<env name="DB_CONNECTION" value="mysql" force="true"/>#' \
              -e 's#<env name="DB_DATABASE" value=":memory:"/>#<env name="DB_DATABASE" value="gavi_test" force="true"/>#' \
              phpunit.xml > phpunit.mysql.xml
          php artisan test --configuration=phpunit.mysql.xml

  # ---------------------------------------------------------------------------
  # 3. Construction de la release : dépendances de production + assets compilés.
  # ---------------------------------------------------------------------------
  build:
    name: Construire la release
    needs: tests
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}

      - name: Dépendances de production
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-scripts

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Assets de production
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Archive
        run: |
          echo "${GITHUB_SHA}" > REVISION
          tar --exclude=./.git --exclude=./.github --exclude=./node_modules --exclude=./tests \
              --exclude=./storage --exclude=./.env --exclude=./phpunit.xml \
              -czf "$RUNNER_TEMP/release.tar.gz" .
          mv "$RUNNER_TEMP/release.tar.gz" release.tar.gz
          ls -lh release.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Publication : la release devient une GitHub Release « deploy-… ».
  #    Le serveur (cron deploy/pull-deploy.sh) la détecte et l'installe : aucun SSH entrant n'est nécessaire.
  # ---------------------------------------------------------------------------
  publish:
    name: Publier la release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="deploy-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$TAG" release.tar.gz \
            --target "$GITHUB_SHA" --latest=false \
            --title "Déploiement $TAG" \
            --notes "Commit ${GITHUB_SHA}. Installée automatiquement par le serveur (cron pull-deploy.sh) dans les minutes qui suivent."
          # On ne garde que les 10 dernières releases de déploiement.
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^deploy-' | sort -r | tail -n +11 \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
          {
            echo "### Release publiée"
            echo "- Tag : \`$TAG\`"
            echo "- Le serveur l'installera au prochain passage du cron (2 minutes au plus)."
            echo "- Suivi : \`shared/storage/logs/deploy.log\` sur le serveur, puis \`${{ vars.APP_URL || 'APP_URL' }}/up\`."
          } >> "$GITHUB_STEP_SUMMARY"
