# Modèle Nginx pour la plateforme GAVI SIRI R2.
# À copier dans /etc/nginx/sites-available/, adapter server_name, le chemin et la version de PHP-FPM,
# puis : sudo ln -s /etc/nginx/sites-available/gavi-r2.conf /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# HTTPS : sudo certbot --nginx -d gavi.example.org

server {
    listen 80;
    listen [::]:80;
    server_name gavi.example.org;

    # Le lien « current » est résolu à chaque requête grâce à $realpath_root (bascule sans redémarrage).
    root /var/www/gavi-r2/current/public;
    index index.php;
    charset utf-8;

    # Imports CSV/XLSX et fichiers de délimitation.
    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Assets Vite versionnés : cache long.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
