; Worker de queue (synchros ODK/Kobo, imports, moteur de queries).
; À copier dans /etc/supervisor/conf.d/ puis : sudo supervisorctl reread && sudo supervisorctl update
; Adapter le chemin (/var/www/gavi-r2) et l'utilisateur (deploy).
; Le chemin passe par « current » : après chaque déploiement, « php artisan queue:restart »
; arrête proprement les workers et Supervisor les relance sur la nouvelle release.

[program:gavi-r2-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/gavi-r2/current/artisan queue:work --tries=1 --timeout=3600 --sleep=3 --max-time=3600
directory=/var/www/gavi-r2/current
user=deploy
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3660
redirect_stderr=true
stdout_logfile=/var/www/gavi-r2/shared/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
